<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07090d"/><stop offset="1" stop-color="#0d1218"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#00f0ff" opacity="0.035"/></pattern>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#00f0ff"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff2a6d"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d6ff2e"/></marker>
  </defs>
  <rect width="1000" height="900" fill="url(#bg)"/><rect width="1000" height="900" fill="url(#scan)"/>
  <text x="40" y="46" fill="#00f0ff" font-size="20" font-weight="700" letter-spacing="4">TOKEN PIPELINE</text>
  <text x="40" y="70" fill="#ffe066" font-size="13" font-weight="700">1 トークン・1 レイヤーの流れ（48 層を繰り返す）</text>
  <text x="960" y="46" text-anchor="end" fill="#ff2a6d" font-size="13" font-weight="700">STRATA / 00_overview</text>

  <!-- embedding -->
  <rect x="330" y="92" width="340" height="46" fill="#0b1119" stroke="#00f0ff" stroke-width="1.4"/>
  <text x="348" y="113" fill="#ffe066" font-size="13" font-weight="700">embedding_gather（量子化埋め込み）</text>
  <text x="348" y="131" fill="#8fa3b8" font-size="13">code_bits 2/4/8 → (code + bias) * scale + offset</text>
  <line x1="500" y1="138" x2="500" y2="164" stroke="#00f0ff" stroke-width="2" marker-end="url(#ac)"/>

  <!-- GR read -->
  <rect x="330" y="166" width="340" height="40" fill="#0b1119" stroke="#d6ff2e" stroke-width="1.2"/>
  <text x="348" y="191" fill="#d6ff2e" font-size="13" font-weight="700">GR read（ハイパーコネクション 4 ストリーム）</text>
  <line x1="500" y1="206" x2="500" y2="230" stroke="#00f0ff" stroke-width="2" marker-end="url(#ac)"/>

  <!-- mixer branch -->
  <rect x="120" y="232" width="330" height="96" fill="#0b1119" stroke="#00f0ff" stroke-width="1.4"/>
  <text x="138" y="254" fill="#00f0ff" font-size="13" font-weight="700">GDN（ゲート付きデルタネット）</text>
  <text x="138" y="276" fill="#c9d4e0" font-size="13">qkv=s_gemv → conv → SiLU → l2(q,k) →</text>
  <text x="138" y="296" fill="#c9d4e0" font-size="13">β=sigmoid, gate=softplus·a → 再帰 →</text>
  <text x="138" y="316" fill="#c9d4e0" font-size="13">rms_norm · sigmoid(z) → ssm_out</text>
  <rect x="550" y="232" width="330" height="96" fill="#0b1119" stroke="#00f0ff" stroke-width="1.4"/>
  <text x="568" y="254" fill="#00f0ff" font-size="13" font-weight="700">QSA（疎 attention + indexer）</text>
  <text x="568" y="276" fill="#c9d4e0" font-size="13">q/k/v 射影 → KV 追記 → indexer スコア →</text>
  <text x="568" y="296" fill="#c9d4e0" font-size="13">top-k 512 選択（order key）→ attention</text>
  <text x="568" y="316" fill="#ff2a6d" font-size="13" font-weight="700">hot 64K は VRAM / それ以上は stream</text>
  <text x="48" y="264" fill="#ffe066" font-size="13" font-weight="700">層ごとに</text>
  <text x="48" y="284" fill="#ffe066" font-size="13" font-weight="700">どちらか</text>
  <text x="48" y="304" fill="#8fa3b8" font-size="13">（混在）</text>
  <line x1="490" y1="328" x2="490" y2="352" stroke="#00f0ff" stroke-width="2" marker-end="url(#ac)"/>
  <line x1="700" y1="330" x2="560" y2="352" stroke="#00f0ff" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- GR write -->
  <rect x="330" y="354" width="340" height="38" fill="#0b1119" stroke="#d6ff2e" stroke-width="1.2"/>
  <text x="348" y="378" fill="#d6ff2e" font-size="13" font-weight="700">GR write（BF16 イメージ + 行スケール）</text>
  <line x1="500" y1="392" x2="500" y2="414" stroke="#00f0ff" stroke-width="2" marker-end="url(#ac)"/>

  <!-- router -->
  <rect x="120" y="416" width="760" height="52" fill="#0b1119" stroke="#ff2a6d" stroke-width="1.4"/>
  <text x="138" y="438" fill="#ff2a6d" font-size="13" font-weight="700">router: x を BF16 に → 512 logits → top-10 → softmax(全体) → 安定 argsort</text>
  <text x="138" y="458" fill="#c9e0c0" font-size="13">→ w / max(sum, 2⁻¹⁴)</text>
  <text x="392" y="458" fill="#ffe066" font-size="13" font-weight="700">※ 2⁻¹⁴ はゼロ除算除け／BF16 でないと top-10 が変わる</text>

  <!-- doorbell -->
  <line x1="500" y1="468" x2="500" y2="492" stroke="#d6ff2e" stroke-width="2.4" marker-end="url(#aa)"/>
  <text x="520" y="486" fill="#d6ff2e" font-size="13" font-weight="700">doorbell: seq 番号をピンドメモリへ</text>

  <!-- parallel region -->
  <rect x="40" y="494" width="920" height="196" fill="none" stroke="#d6ff2e" stroke-width="1" stroke-dasharray="8 6" opacity="0.6"/>
  <text x="56" y="514" fill="#d6ff2e" font-size="13" font-weight="700" letter-spacing="2">並行して走る（この重なりが速度の源）</text>

  <rect x="70" y="528" width="420" height="120" fill="#0b1119" stroke="#d6ff2e" stroke-width="1.4"/>
  <text x="88" y="550" fill="#d6ff2e" font-size="13" font-weight="700">GPU: shared expert + キャッシュ済み expert</text>
  <text x="88" y="572" fill="#c9d4e0" font-size="13">h = silu(x·Wg) * (x·Wu) → h·Wd</text>
  <text x="88" y="592" fill="#c9d4e0" font-size="13">g = sigmoid(x·w) ← トークンごとに 1 スカラ</text>
  <text x="88" y="612" fill="#ffe066" font-size="13" font-weight="700">結果は「足す」（router 重みは掛けない）</text>
  <text x="88" y="634" fill="#8fa3b8" font-size="13">shared の 3 射影は 5.5 MB を読む＝床は 0.009 ms</text>

  <rect x="520" y="528" width="410" height="120" fill="#0b1119" stroke="#ff2a6d" stroke-width="1.4"/>
  <text x="538" y="550" fill="#ff2a6d" font-size="13" font-weight="700">CPU: VRAM に居ない expert をその場で</text>
  <text x="538" y="572" fill="#c9d4e0" font-size="13">pinned RAM の blob を AVX-512/AVX2 で</text>
  <text x="538" y="592" fill="#c9d4e0" font-size="13">ggml i-quant カーネル + int8 ドット</text>
  <text x="538" y="612" fill="#ffe066" font-size="13" font-weight="700">検証中はコアの ~97% をこれが握る</text>
  <text x="538" y="634" fill="#8fa3b8" font-size="13">→ GPU 側の改善が分散に埋もれる理由</text>

  <!-- combine -->
  <line x1="280" y1="648" x2="400" y2="694" stroke="#00f0ff" stroke-width="1.8" marker-end="url(#ac)"/>
  <line x1="720" y1="648" x2="600" y2="694" stroke="#ff2a6d" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="330" y="696" width="340" height="44" fill="#0b1119" stroke="#00f0ff" stroke-width="1.4"/>
  <text x="348" y="716" fill="#00f0ff" font-size="13" font-weight="700">moe_finish: combine（10 個の重み付き和）</text>
  <text x="348" y="734" fill="#8fa3b8" font-size="13">+ shared expert のスカラ倍を加算</text>
  <line x1="500" y1="740" x2="500" y2="764" stroke="#00f0ff" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="330" y="766" width="340" height="40" fill="#0b1119" stroke="#d6ff2e" stroke-width="1.2"/>
  <text x="348" y="790" fill="#d6ff2e" font-size="13" font-weight="700">GR write → 次の層へ（×48）</text>
  <line x1="670" y1="786" x2="760" y2="786" stroke="#00f0ff" stroke-width="1.6" marker-end="url(#ac)"/>
  <text x="770" y="780" fill="#ffe066" font-size="13" font-weight="700">final norm</text>
  <text x="770" y="800" fill="#ffe066" font-size="13" font-weight="700">→ 出力ヘッド</text>
  <text x="880" y="780" fill="#00f0ff" font-size="13" font-weight="700">→ sampler</text>
  <text x="880" y="800" fill="#ff2a6d" font-size="13" font-weight="700">/ MTP 検証</text>

  <!-- left margin notes -->
  <text x="40" y="150" fill="#8fa3b8" font-size="13">※ 各箱の実装は</text>
  <text x="40" y="170" fill="#8fa3b8" font-size="13">  docs/03–05 参照</text>
  <text x="40" y="196" fill="#ff2a6d" font-size="13" font-weight="700">block_layer_pre</text>
  <text x="40" y="216" fill="#ff2a6d" font-size="13" font-weight="700">block_layer_post</text>
  <text x="40" y="360" fill="#ff2a6d" font-size="13" font-weight="700">← ここまで pre</text>
  <text x="40" y="380" fill="#ff2a6d" font-size="13" font-weight="700">  ここから post</text>
  <text x="40" y="860" fill="#8fa3b8" font-size="13">1 パスで 2.4–3.2 トークン（MTP 3 枚 + prompt lookup 最大 5 枚）</text>
</svg>
