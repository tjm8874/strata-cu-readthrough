<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf8f2"/></linearGradient>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9e2b25"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4f5d00"/></marker>
    <clipPath id="c1"><polygon points="12,0 100,0 100,88 88,100 0,100 0,12"/></clipPath>
  </defs>
  <rect width="1000" height="680" fill="url(#bg)"/>
  <text x="40" y="46" fill="#1f4e79" font-size="20" font-weight="700" letter-spacing="4">MEMORY HIERARCHY</text>
  <text x="40" y="70" fill="#7a5c12" font-size="13" font-weight="700" letter-spacing="1">4 層の間を毎トークン、毎レイヤー、データが移動する</text>
  <text x="960" y="46" text-anchor="end" fill="#9e2b25" font-size="13" font-weight="700">STRATA / 01_memory</text>

  <!-- ===== SSD ===== -->
  <g clip-path="url(#c1)" transform="translate(40,100)"><rect width="100" height="100" fill="#f4f1e7" stroke="#9e2b25" stroke-width="1.6"/></g>
  <text x="60" y="132" fill="#9e2b25" font-size="13" font-weight="700">SSD</text>
  <text x="60" y="158" fill="#232323" font-size="13">pack 38 GiB</text>
  <text x="60" y="180" fill="#4f5d00" font-size="13" font-weight="700">Q2_0 31.6 GiB</text>
  <text x="172" y="124" fill="#232323" font-size="13">重みは基本ここにしかない（常駐しない）</text>
  <text x="172" y="150" fill="#232323" font-size="13">PLE n-gram 表 28.8 GB（別ファイル）</text>
  <text x="172" y="176" fill="#7a5c12" font-size="13" font-weight="700">mmap / --ple-io direct（非バッファ）</text>
  <text x="172" y="198" fill="#6a6a6a" font-size="13">3–7 GB/s 級（ランダムは更に遅い）</text>

  <!-- ===== VRAM card ===== -->
  <g clip-path="url(#c1)" transform="translate(860,100)"><rect width="100" height="100" fill="#f4f1e7" stroke="#4f5d00" stroke-width="1.6"/></g>
  <text x="878" y="132" fill="#4f5d00" font-size="13" font-weight="700">VRAM</text>
  <text x="878" y="158" fill="#232323" font-size="13">12–24 GiB</text>

  <!-- ===== HOST RAM card ===== -->
  <g clip-path="url(#c1)" transform="translate(40,250)"><rect width="100" height="100" fill="#f4f1e7" stroke="#1f4e79" stroke-width="1.6"/></g>
  <text x="60" y="282" fill="#1f4e79" font-size="13" font-weight="700">HOST</text>
  <text x="60" y="302" fill="#1f4e79" font-size="13" font-weight="700">RAM</text>
  <text x="60" y="328" fill="#232323" font-size="13">pinned</text>
  <line x1="90" y1="202" x2="90" y2="248" stroke="#9e2b25" stroke-width="2" marker-end="url(#am)"/>
  <text x="104" y="212" fill="#9e2b25" font-size="13" font-weight="700">起動時 1 回</text>

  <!-- ===== RAM panel ===== -->
  <rect x="155" y="226" width="420" height="186" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="171" y="250" fill="#7a5c12" font-size="13" font-weight="700">cudaHostAlloc / HUGETLB 2 MB</text>
  <text x="171" y="276" fill="#232323" font-size="13">・24,576 experts（48 層 × 512）</text>
  <text x="171" y="300" fill="#232323" font-size="13">・expert ring（STRATA_RING_BYTES）</text>
  <text x="171" y="324" fill="#232323" font-size="13">・doorbell ページ（GPU が書く）</text>
  <text x="171" y="348" fill="#232323" font-size="13">・KV のコールドミラー</text>
  <text x="171" y="378" fill="#4f5d00" font-size="13" font-weight="700">CPU は expert をここで計算する</text>
  <text x="171" y="400" fill="#6a6a6a" font-size="13">AVX-512 / AVX2、ggml i-quant</text>

  <!-- ===== PCIe bus ===== -->
  <rect x="592" y="226" width="42" height="186" fill="#f4f1e7" stroke="#1f4e79" stroke-width="1.2"/>
  <text transform="translate(613,352) rotate(-90)" text-anchor="middle" fill="#1f4e79" font-size="13" font-weight="700">PCIe 64 GB/s</text>
  <line x1="575" y1="262" x2="590" y2="262" stroke="#1f4e79" stroke-width="2.4"/>
  <line x1="634" y1="262" x2="646" y2="262" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#ac)"/>

  <!-- ===== VRAM panel ===== -->
  <rect x="648" y="226" width="312" height="186" fill="#ffffff" stroke="#4f5d00" stroke-width="1.2"/>
  <text x="664" y="250" fill="#7a5c12" font-size="13" font-weight="700">毎トークン読む重み</text>
  <text x="664" y="274" fill="#232323" font-size="13">attention + GDN 混合子</text>
  <text x="664" y="296" fill="#232323" font-size="13">GR / router / shared expert</text>
  <text x="664" y="318" fill="#232323" font-size="13">出力ヘッド / MTP 層</text>
  <text x="664" y="344" fill="#4f5d00" font-size="13" font-weight="700">expert cache（適応型）</text>
  <text x="664" y="364" fill="#232323" font-size="13">≈ 700 experts / GiB</text>
  <text x="664" y="388" fill="#9e2b25" font-size="13" font-weight="700">KV hot: 64K トークン</text>
  <text x="664" y="406" fill="#6a6a6a" font-size="13">残りは q8 / q4 でホストへ</text>

  <!-- ===== SMEM card + detail ===== -->
  <g clip-path="url(#c1)" transform="translate(40,470)"><rect width="100" height="100" fill="#f4f1e7" stroke="#9e2b25" stroke-width="1.6"/></g>
  <text x="58" y="502" fill="#9e2b25" font-size="13" font-weight="700">SMEM</text>
  <text x="58" y="522" fill="#6a6a6a" font-size="13">/ REG</text>
  <text x="58" y="550" fill="#232323" font-size="13">~228 KB/SM</text>
  <path d="M656,412 L656,438 L90,438 L90,466" fill="none" stroke="#9e2b25" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
  <text x="300" y="430" fill="#6a6a6a" font-size="13">タイルごとに VRAM → SMEM へ</text>
  <text x="172" y="500" fill="#232323" font-size="13">・top-k 選択の 512 ロジット</text>
  <text x="172" y="524" fill="#232323" font-size="13">・attention スコア 8 KB/head</text>
  <text x="172" y="548" fill="#7a5c12" font-size="13" font-weight="700">・WMMA 4 KB ダブルバッファ</text>
  <text x="172" y="576" fill="#6a6a6a" font-size="13">1 ブロックが掴めるのはこれだけ</text>
  <text x="172" y="598" fill="#6a6a6a" font-size="13">→ タイル分割の理由がここにある</text>

  <!-- ===== doorbell ===== -->
  <path d="M700,412 C720,452 760,458 800,452" fill="none" stroke="#4f5d00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aa)"/>
  <rect x="596" y="470" width="364" height="126" fill="#ffffff" stroke="#4f5d00" stroke-width="1.2"/>
  <text x="612" y="494" fill="#4f5d00" font-size="13" font-weight="700">doorbell（逆方向）</text>
  <text x="612" y="518" fill="#232323" font-size="13">GPU がホストのページに seq を書く</text>
  <text x="612" y="540" fill="#232323" font-size="13">CPU はポーリングで待つ</text>
  <text x="612" y="566" fill="#9e2b25" font-size="13" font-weight="700">イベントはキャプチャで消える</text>
  <text x="612" y="586" fill="#6a6a6a" font-size="13">データなら消えない</text>

  <!-- ===== bandwidth ladder ===== -->
  <rect x="40" y="622" width="920" height="46" fill="#ffffff" stroke="#9e2b25" stroke-width="1" opacity="0.85"/>
  <text x="56" y="650" fill="#9e2b25" font-size="13" font-weight="700">SMEM ≈20 TB/s</text>
  <text x="240" y="650" fill="#232323" font-size="13">&lt; 1 ns</text>
  <text x="330" y="650" fill="#9e2b25" font-size="13" font-weight="700">VRAM ≈1.8 TB/s</text>
  <text x="490" y="650" fill="#232323" font-size="13">≈100 ns</text>
  <text x="590" y="650" fill="#9e2b25" font-size="13" font-weight="700">PCIe ≈60 GB/s</text>
  <text x="740" y="650" fill="#232323" font-size="13">≈µs</text>
  <text x="800" y="650" fill="#9e2b25" font-size="13" font-weight="700">SSD ≈5 GB/s ≈ms</text>
</svg>
