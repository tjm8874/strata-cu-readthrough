<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf8f2"/></linearGradient>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9e2b25"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4f5d00"/></marker>
  </defs>
  <rect width="1000" height="760" fill="url(#bg)"/>  <text x="40" y="46" fill="#1f4e79" font-size="20" font-weight="700" letter-spacing="4">KV CACHE / 3 TIERS</text>
  <text x="40" y="70" fill="#7a5c12" font-size="13" font-weight="700">hot 64K は VRAM、それ以上は圧縮してホストへ、indexer は FP32（正確なキー）</text>
  <text x="960" y="46" text-anchor="end" fill="#9e2b25" font-size="13" font-weight="700">STRATA / 05_attention</text>

  <!-- paged layout -->
  <rect x="40" y="92" width="470" height="236" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="58" y="116" fill="#1f4e79" font-size="13" font-weight="700">ページド配置（12 層 × 2 kv head × 256 dim）</text>
  <text x="58" y="144" fill="#232323" font-size="13">page = table[t / page_size]</text>
  <text x="58" y="166" fill="#232323" font-size="13">row  = (page·n_kv_head + h)·page_size + (t % page_size)</text>
  <text x="58" y="192" fill="#7a5c12" font-size="13" font-weight="700">→ 1 head のセルはページ内で連続</text>
  <text x="58" y="214" fill="#6a6a6a" font-size="13">K/V は FP16。32768 トークンで 805 MiB（f32 なら 1.6 GiB）</text>
  <text x="58" y="242" fill="#4f5d00" font-size="13" font-weight="700">この式の外側でマッピングを仮定してはいけない:</text>
  <text x="58" y="262" fill="#6a6a6a" font-size="13">page_size 1 / 4 / 512 + 置換済みテーブルで</text>
  <text x="58" y="282" fill="#6a6a6a" font-size="13">「同一の attention 出力」を要求するテストがある</text>
  <text x="58" y="308" fill="#9e2b25" font-size="13" font-weight="700">indexer キーだけは FP32（correctness の要）</text>

  <!-- tier bars -->
  <rect x="560" y="92" width="400" height="120" fill="#ffffff" stroke="#4f5d00" stroke-width="1.4"/>
  <text x="578" y="116" fill="#4f5d00" font-size="13" font-weight="700">Tier 1: VRAM（hot 64K）</text>
  <text x="578" y="140" fill="#232323" font-size="13">attention が直接読む。qsa_attend は</text>
  <text x="578" y="160" fill="#232323" font-size="13">head あたり 1 ブロック・スコア 8 KB を SMEM</text>
  <text x="578" y="184" fill="#7a5c12" font-size="13" font-weight="700">24 ブロック × 256 スレッド</text>
  <text x="578" y="204" fill="#6a6a6a" font-size="13">スコアは 1 スレッド=1 セル、値は 1 スレッド=1 次元</text>

  <rect x="560" y="228" width="400" height="100" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="578" y="252" fill="#1f4e79" font-size="13" font-weight="700">Tier 2: ホスト（コールド）</text>
  <text x="578" y="276" fill="#232323" font-size="13">kv_stream.cu のリング（copy / reset / ring）</text>
  <text x="578" y="296" fill="#232323" font-size="13">プレフィックス和、16 B/スレッド</text>
  <text x="578" y="318" fill="#7a5c12" font-size="13" font-weight="700">KV_PREFETCH で先読み</text>

  <rect x="560" y="346" width="400" height="120" fill="#ffffff" stroke="#9e2b25" stroke-width="1.4"/>
  <text x="578" y="370" fill="#9e2b25" font-size="13" font-weight="700">Tier 3: 圧縮（q8 / q4）</text>
  <text x="578" y="394" fill="#232323" font-size="13">書く前に fwht256（Hadamard 回転）</text>
  <text x="578" y="414" fill="#232323" font-size="13">kv_q8.cu / kv_q4.cu（Q4_0 + 回転, PR #21）</text>
  <text x="578" y="438" fill="#4f5d00" font-size="13" font-weight="700">回転は直交 → 内積が変わらない</text>
  <text x="578" y="458" fill="#6a6a6a" font-size="13">だから「圧縮しても attention がほぼ同じ」</text>

  <!-- compression pipeline -->
  <line x1="40" y1="496" x2="960" y2="496" stroke="#9e2b25" stroke-width="0.8" opacity="0.4"/>
  <text x="40" y="524" fill="#9e2b25" font-size="13" font-weight="700" letter-spacing="2">書き込み経路</text>

  <rect x="40" y="540" width="150" height="70" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="56" y="566" fill="#1f4e79" font-size="13" font-weight="700">k, v（FP16）</text>
  <text x="56" y="588" fill="#6a6a6a" font-size="13">射影の出力</text>
  <line x1="190" y1="575" x2="240" y2="575" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="242" y="540" width="170" height="70" fill="#ffffff" stroke="#4f5d00" stroke-width="1.2"/>
  <text x="258" y="566" fill="#4f5d00" font-size="13" font-weight="700">fwht256</text>
  <text x="258" y="588" fill="#6a6a6a" font-size="13">外れ値を分散</text>
  <line x1="412" y1="575" x2="462" y2="575" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="464" y="540" width="220" height="70" fill="#ffffff" stroke="#9e2b25" stroke-width="1.2"/>
  <text x="480" y="566" fill="#9e2b25" font-size="13" font-weight="700">量子化（q8 / q4）</text>
  <text x="480" y="588" fill="#6a6a6a" font-size="13">グループ最大は決定的に</text>
  <line x1="684" y1="575" x2="734" y2="575" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="736" y="540" width="224" height="70" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="752" y="566" fill="#1f4e79" font-size="13" font-weight="700">kv_stream リング</text>
  <text x="752" y="588" fill="#6a6a6a" font-size="13">ホストへ / 必要なら戻す</text>

  <!-- read path + topk -->
  <text x="40" y="654" fill="#9e2b25" font-size="13" font-weight="700" letter-spacing="2">読み出し経路（decode）</text>
  <rect x="40" y="668" width="200" height="64" fill="#ffffff" stroke="#4f5d00" stroke-width="1.2"/>
  <text x="56" y="692" fill="#4f5d00" font-size="13" font-weight="700">indexer スコア</text>
  <text x="56" y="714" fill="#6a6a6a" font-size="13">4 head の relu(q·k) + bias</text>
  <line x1="240" y1="700" x2="290" y2="700" stroke="#4f5d00" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="292" y="668" width="250" height="64" fill="#ffffff" stroke="#9e2b25" stroke-width="1.2"/>
  <text x="308" y="692" fill="#9e2b25" font-size="13" font-weight="700">top-k 512（order key）</text>
  <text x="308" y="714" fill="#6a6a6a" font-size="13">32 回の単調パス + 1 回の昇順走査</text>
  <line x1="542" y1="700" x2="592" y2="700" stroke="#9e2b25" stroke-width="2" marker-end="url(#am)"/>

  <rect x="594" y="668" width="366" height="64" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2"/>
  <text x="610" y="692" fill="#1f4e79" font-size="13" font-weight="700">qsa_attend / decode_attn / flash_attn</text>
  <text x="610" y="714" fill="#7a5c12" font-size="13" font-weight="700">選ばれたセルだけ値を見る（疎）</text>

  <text x="40" y="752" fill="#6a6a6a" font-size="13">※ キャプチャ監査: pos / n_kv / n_bid / width は device 上の step バッファに置く（引数を凍結させない）</text>
</svg>
