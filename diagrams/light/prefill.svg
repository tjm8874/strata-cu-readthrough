<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#faf8f2"/></linearGradient>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f4e79"/></marker>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9e2b25"/></marker>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4f5d00"/></marker>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>  <text x="40" y="46" fill="#1f4e79" font-size="20" font-weight="700" letter-spacing="4">PREFILL PIPELINE</text>
  <text x="40" y="70" fill="#7a5c12" font-size="13" font-weight="700">計算律速なので decode とは別実装。チャンク最大 8,192 トークン</text>
  <text x="960" y="46" text-anchor="end" fill="#9e2b25" font-size="13" font-weight="700">STRATA / 06_prefill</text>

  <!-- chunk -->
  <rect x="40" y="100" width="200" height="70" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="58" y="124" fill="#1f4e79" font-size="13" font-weight="700">プロンプト</text>
  <text x="58" y="146" fill="#232323" font-size="13">8,192（opt-in 32,768）</text>
  <text x="58" y="164" fill="#6a6a6a" font-size="13">チャンクに切って流す</text>
  <line x1="240" y1="135" x2="282" y2="135" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>

  <!-- dense part -->
  <rect x="284" y="96" width="260" height="78" fill="#ffffff" stroke="#4f5d00" stroke-width="1.4"/>
  <text x="302" y="118" fill="#4f5d00" font-size="13" font-weight="700">密な部分（attention / GDN / GR）</text>
  <text x="302" y="140" fill="#232323" font-size="13">バッチ GEMM（ライブラリか WMMA）</text>
  <text x="302" y="160" fill="#6a6a6a" font-size="13">トークン数 × 10240 が一気に通る</text>
  <line x1="544" y1="135" x2="586" y2="135" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>

  <!-- router -->
  <rect x="588" y="96" width="180" height="78" fill="#ffffff" stroke="#9e2b25" stroke-width="1.4"/>
  <text x="606" y="118" fill="#9e2b25" font-size="13" font-weight="700">router（トークン毎）</text>
  <text x="606" y="140" fill="#232323" font-size="13">top-10 を決め、</text>
  <text x="606" y="160" fill="#232323" font-size="13">expert でグループ化</text>
  <line x1="768" y1="135" x2="810" y2="135" stroke="#9e2b25" stroke-width="2" marker-end="url(#am)"/>

  <rect x="812" y="96" width="148" height="78" fill="#f4f1e7" stroke="#9e2b25" stroke-width="1.4"/>
  <text x="828" y="118" fill="#9e2b25" font-size="13" font-weight="700">expert 群</text>
  <text x="828" y="140" fill="#232323" font-size="13">必要な分だけ</text>
  <text x="828" y="160" fill="#7a5c12" font-size="13" font-weight="700">PCIe で流入</text>

  <!-- stream arrow -->
  <line x1="886" y1="174" x2="886" y2="216" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#ac)"/>
  <text x="470" y="196" fill="#1f4e79" font-size="13" font-weight="700">リングは 0.1.39b 以降バイト単位</text>
  <text x="470" y="216" fill="#6a6a6a" font-size="13">STRATA_RING_BYTES で指定</text>

  <!-- expert GEMM band -->
  <rect x="40" y="230" width="920" height="110" fill="#ffffff" stroke="#4f5d00" stroke-width="1.6"/>
  <text x="58" y="254" fill="#4f5d00" font-size="13" font-weight="700" letter-spacing="2">EXPERT GEMM（4 系統）</text>
  <rect x="58" y="266" width="200" height="58" fill="#f4f1e7" stroke="#1f4e79" stroke-width="1"/>
  <text x="70" y="288" fill="#1f4e79" font-size="13" font-weight="700">gemm.cu</text>
  <text x="70" y="310" fill="#6a6a6a" font-size="13">cuBLAS / hipBLASLt</text>
  <rect x="268" y="266" width="200" height="58" fill="#f4f1e7" stroke="#1f4e79" stroke-width="1"/>
  <text x="280" y="288" fill="#1f4e79" font-size="13" font-weight="700">wmma_gemm.cu</text>
  <text x="280" y="310" fill="#6a6a6a" font-size="13">RDNA3 自前タイル</text>
  <rect x="478" y="266" width="230" height="58" fill="#f4f1e7" stroke="#9e2b25" stroke-width="1"/>
  <text x="490" y="288" fill="#9e2b25" font-size="13" font-weight="700">moe_fused(_iq).cu</text>
  <text x="490" y="310" fill="#6a6a6a" font-size="13">自前 int8 テンソルコア</text>
  <rect x="718" y="266" width="222" height="58" fill="#f4f1e7" stroke="#4f5d00" stroke-width="1"/>
  <text x="730" y="288" fill="#4f5d00" font-size="13" font-weight="700">moe_mmq.cu</text>
  <text x="730" y="310" fill="#6a6a6a" font-size="13">llama.cpp MMQ（参照）</text>

  <!-- magic float detail -->
  <line x1="490" y1="340" x2="490" y2="372" stroke="#9e2b25" stroke-width="2" marker-end="url(#am)"/>
  <rect x="240" y="374" width="520" height="96" fill="#f4f1e7" stroke="#9e2b25" stroke-width="1.2"/>
  <text x="258" y="396" fill="#9e2b25" font-size="13" font-weight="700">magic float（Q2_0 を int8 テンソルコアで積む）</text>
  <text x="258" y="420" fill="#232323" font-size="13">Σ w x = d_w · d_x · (Σ q a − Σ a)</text>
  <text x="258" y="442" fill="#4f5d00" font-size="13" font-weight="700">as_float(0x4B400000 + dot) = 1.5·2²³ + dot（丸め無し）</text>
  <text x="258" y="462" fill="#6a6a6a" font-size="13">ブロックは c = −(1.5·2²³ + Σa) を保存 → 1 命令で整数差</text>

  <!-- combine -->
  <line x1="500" y1="470" x2="500" y2="504" stroke="#1f4e79" stroke-width="2" marker-end="url(#ac)"/>
  <rect x="330" y="506" width="340" height="56" fill="#ffffff" stroke="#1f4e79" stroke-width="1.4"/>
  <text x="348" y="528" fill="#1f4e79" font-size="13" font-weight="700">combine → GR write → 次の層</text>
  <text x="348" y="548" fill="#6a6a6a" font-size="13">融合は「同じビット」を証明できたものだけ</text>

  <!-- side notes -->
  <rect x="40" y="374" width="180" height="188" fill="#ffffff" stroke="#4f5d00" stroke-width="1"/>
  <text x="56" y="396" fill="#4f5d00" font-size="13" font-weight="700">環境変数</text>
  <text x="56" y="418" fill="#232323" font-size="13">RING_BYTES</text>
  <text x="56" y="438" fill="#232323" font-size="13">PREFILL_CPU_SHARE</text>
  <text x="56" y="458" fill="#232323" font-size="13">ROUTE_TAIL_SKIP</text>
  <text x="56" y="478" fill="#232323" font-size="13">PREFILL_BF16X2</text>
  <text x="56" y="504" fill="#7a5c12" font-size="13" font-weight="700">--pcie-frac</text>
  <text x="56" y="524" fill="#7a5c12" font-size="13" font-weight="700">--aux-cpus</text>
  <text x="56" y="540" fill="#6a6a6a" font-size="13">CPU 側にも expert を</text>
  <text x="56" y="556" fill="#6a6a6a" font-size="13">配分できる</text>

  <rect x="790" y="374" width="170" height="188" fill="#ffffff" stroke="#1f4e79" stroke-width="1"/>
  <text x="806" y="396" fill="#1f4e79" font-size="13" font-weight="700">parity</text>
  <text x="806" y="418" fill="#232323" font-size="13">gdn_rec_parity</text>
  <text x="806" y="438" fill="#232323" font-size="13">gemm_bf16_parity</text>
  <text x="806" y="466" fill="#7a5c12" font-size="13" font-weight="700">prefill と decode が</text>
  <text x="806" y="484" fill="#7a5c12" font-size="13" font-weight="700">ビット一致することを</text>
  <text x="806" y="502" fill="#7a5c12" font-size="13" font-weight="700">専用実行で証明</text>
  <text x="806" y="530" fill="#6a6a6a" font-size="13">二重実装の唯一の</text>
  <text x="806" y="548" fill="#6a6a6a" font-size="13">安全弁</text>

  <text x="40" y="600" fill="#9e2b25" font-size="13" font-weight="700">BF16 テンソルコアが無いカード（Turing/Volta）:</text>
  <text x="40" y="622" fill="#232323" font-size="13">BF16 → FP16 は FP16 正規範囲内で厳密（仮数 7 bit が 10 bit に収まる）。</text>
  <text x="40" y="644" fill="#232323" font-size="13">範囲外の有限値は ±65504 にクランプ。Pascal は fp32 に広げて cublasSgemm（#395）。</text>
  <text x="40" y="674" fill="#4f5d00" font-size="13" font-weight="700">教訓: ライブラリが静かに遅い経路に落ちるなら、意味を保ったまま別の型に写して速い経路に乗せる。</text>
</svg>
